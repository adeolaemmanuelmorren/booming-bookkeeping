<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPC under suppressed dialog</title>
  <style id="spike-prehide">
    #CybotCookiebotDialog {
      display: none !important;
    }
  </style>
  <script>
    Object.defineProperty(navigator, 'globalPrivacyControl', {
      configurable: true,
      value: true
    });

    console.log(
      '[spike] navigator.globalPrivacyControl:',
      navigator.globalPrivacyControl
    );

    window.addEventListener('CookiebotOnDialogInit', function () {
      console.log('[spike] DialogInit under emulated GPC');
      Cookiebot.hide();
    });

    window.addEventListener('CookiebotOnConsentReady', function () {
      logConsentState('ConsentReady');
    });

    function logConsentState(label) {
      console.log('[spike] ' + label + ':', JSON.stringify({
        hasResponse: Cookiebot.hasResponse,
        method: Cookiebot.consent.method,
        preferences: Cookiebot.consent.preferences,
        statistics: Cookiebot.consent.statistics,
        marketing: Cookiebot.consent.marketing,
        gpc: navigator.globalPrivacyControl
      }));
    }
  </script>
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="21bb6503-4138-4b7f-a6f8-137252c64eca"
    type="text/javascript"
    async
  ></script>
</head>
<body>
  <h1>GPC under suppressed dialog</h1>
  <p>The banner is CSS-hidden while Cookiebot receives an emulated GPC signal.</p>
  <button type="button" onclick="logConsentState('current state')">
    Log consent state
  </button>
</body>
</html>
