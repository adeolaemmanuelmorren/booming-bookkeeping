<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Cookiebot test state</title>
</head>
<body>
  <h1>Cookiebot test state reset</h1>
  <p id="status">Clearing the CookieConsent cookie…</p>

  <script>
    function expireCookie(domain) {
      var domainAttribute = domain ? '; domain=' + domain : '';

      document.cookie = [
        'CookieConsent=',
        'expires=Thu, 01 Jan 1970 00:00:00 GMT',
        'path=/' + domainAttribute,
        'SameSite=Lax'
      ].join('; ');
    }

    expireCookie('');
    expireCookie(location.hostname);
    expireCookie('.' + location.hostname);

    var cookieIsPresent = document.cookie.indexOf('CookieConsent=') !== -1;
    var statusElement = document.getElementById('status');

    if (cookieIsPresent) {
      statusElement.textContent = 'Reset failed: CookieConsent is still present.';
    } else {
      statusElement.textContent = 'Reset complete: CookieConsent is absent.';
    }
  </script>
</body>
</html>
