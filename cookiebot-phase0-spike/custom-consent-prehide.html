<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C: submitCustomConsent pre-dialog with CSS pre-hide</title>
  <style id="spike-prehide">
    #CybotCookiebotDialog {
      display: none !important;
    }
  </style>
  <script>
    window.addEventListener('CookiebotOnDialogInit', function () {
      console.log('[spike] DialogInit — submitting custom opt-out');
      Cookiebot.submitCustomConsent(false, false, false);
    });

    window.addEventListener('CookiebotOnConsentReady', function () {
      console.log('[spike] ConsentReady:', JSON.stringify({
        hasResponse: Cookiebot.hasResponse,
        method: Cookiebot.consent.method,
        preferences: Cookiebot.consent.preferences,
        statistics: Cookiebot.consent.statistics,
        marketing: Cookiebot.consent.marketing
      }));
      console.log(
        '[spike] CookieConsent cookie present:',
        document.cookie.indexOf('CookieConsent=') !== -1
      );
    });
  </script>
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="21bb6503-4138-4b7f-a6f8-137252c64eca"
    type="text/javascript"
    async
  ></script>
</head>
<body>
  <h1>Custom consent before dialog with CSS pre-hide</h1>
  <p>No banner should appear; all optional categories should be false.</p>
</body>
</html>
