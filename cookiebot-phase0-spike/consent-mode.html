<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D: consent mode</title>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      functionality_storage: 'denied',
      personalization_storage: 'denied',
      security_storage: 'granted',
      wait_for_update: 2000
    });

    // Log every consent update Cookiebot pushes.
    var originalPush = dataLayer.push.bind(dataLayer);
    dataLayer.push = function () {
      var args = Array.prototype.slice.call(arguments);
      var firstArgument = args[0];
      var eventName = firstArgument && firstArgument.event
        ? firstArgument.event
        : '';
      var isConsentCommand = firstArgument && firstArgument[0] === 'consent';
      var isCookieConsentEvent = eventName.indexOf('cookie_consent') === 0;

      if (isConsentCommand || isCookieConsentEvent) {
        console.log('[spike] dataLayer:', JSON.stringify(args));
      }

      return originalPush.apply(null, args);
    };

    window.addEventListener('CookiebotOnDialogInit', function () {
      Cookiebot.hide();
    });
  </script>
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="21bb6503-4138-4b7f-a6f8-137252c64eca"
    data-consentmode="auto"
    type="text/javascript"
    async
  ></script>
</head>
<body>
  <h1>Consent Mode under suppression</h1>
</body>
</html>
