<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E: Apply transferred opt-in</title>
  <script>
    function logConsentState(eventName) {
      console.log('[spike] ' + eventName + ':', JSON.stringify({
        hasResponse: Cookiebot.hasResponse,
        method: Cookiebot.consent.method,
        preferences: Cookiebot.consent.preferences,
        statistics: Cookiebot.consent.statistics,
        marketing: Cookiebot.consent.marketing
      }));

      console.log(
        '[spike] CookieConsent cookie present:',
        document.cookie.indexOf('CookieConsent=') !== -1
      );
    }

    window.addEventListener('CookiebotOnDialogInit', function () {
      console.log('[spike] DialogInit — applying transferred opt-in');
      Cookiebot.submitCustomConsent(true, true, true);
    });

    window.addEventListener('CookiebotOnConsentReady', function () {
      logConsentState('ConsentReady');
    });
  </script>
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="21bb6503-4138-4b7f-a6f8-137252c64eca"
    type="text/javascript"
    async
  ></script>
</head>
<body>
  <h1>Transferred opt-in test</h1>
  <p>The notice should stay hidden and all optional categories should be allowed.</p>
</body>
</html>
