<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B: suppressed dialog</title>
  <script>
    // This listener must be registered before the Cookiebot script tag.
    window.addEventListener('CookiebotOnDialogInit', function () {
      console.log(
        '[spike] CookiebotOnDialogInit fired at',
        performance.now().toFixed(0),
        'ms'
      );
      Cookiebot.hide();
    });

    window.addEventListener('CookiebotOnConsentReady', function () {
      console.log(
        '[spike] CookiebotOnConsentReady at',
        performance.now().toFixed(0),
        'ms'
      );
      console.log('[spike] state:', JSON.stringify({
        hasResponse: Cookiebot.hasResponse,
        method: Cookiebot.consent.method,
        preferences: Cookiebot.consent.preferences,
        statistics: Cookiebot.consent.statistics,
        marketing: Cookiebot.consent.marketing
      }));
      console.log(
        '[spike] CookieConsent cookie present:',
        document.cookie.indexOf('CookieConsent=') !== -1
      );
    });
  </script>
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="21bb6503-4138-4b7f-a6f8-137252c64eca"
    type="text/javascript"
    async
  ></script>
</head>
<body>
  <h1>Suppressed dialog</h1>
  <p>No banner should ever be visible on this page.</p>
  <button type="button" onclick="logConsentState()">Log consent state</button>
  <button type="button" onclick="console.log(document.cookie)">Log cookies</button>

  <script>
    function logConsentState() {
      console.log('[spike] current state:', JSON.stringify({
        hasResponse: Cookiebot.hasResponse,
        method: Cookiebot.consent.method,
        preferences: Cookiebot.consent.preferences,
        statistics: Cookiebot.consent.statistics,
        marketing: Cookiebot.consent.marketing
      }));
    }
  </script>
</body>
</html>
